name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow when you push to the main branch
  workflow_dispatch: # Allows you to manually run the workflow from the Actions tab

# Set permissions for the GITHUB_TOKEN to allow deployment
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies 🔧
        run: npm ci

      - name: Build Project 🏗️
        run: npm run build # Generates static files (usually in a folder named 'dist' or 'build')

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Change to 'build' or '_'site' depending on your framework's output folder
          branch: gh-pages # The branch the action will deploy the built files to
